# configs/temporal_cli_simple.yaml
# A simplified baseline configuration for stable training.
# This file removes experimental features like epoch resampling and enhanced learning.

# Model configuration - direct parameters without init_args
model:
  d_model: 512
  n_heads: 8
  n_encoder_layers: 6
  n_decoder_layers: 6
  ff_dim: 2048
  dropout: 0.1
  label_smoothing: 0.0
  content_loss_weight: 1.0
  regr_loss_weight: 0.1
  lr_base: 0.0003
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 200
  use_separate_head_lr: true
  regr_lr_multiplier: 5.0
  delta_e_scaler: 100.0
  train_head: both
  # Experimental features are disabled below
  use_dynamic_lambda: false

# Data configuration
data:
  task: SEQ
  years_range: "2005-2010"
  seed: 412
  train_frac: 0.80
  data_subset_ratio: 1.0 # Use a reasonably large subset for stable training
  batch_size: 64
  gradient_accumulation_steps: 2
  num_workers: 4
  force_rebuild_vocab: false
  # Temporal augmentation is disabled for this baseline
  epoch_resample: false
  k_year_augment: 2

# Trainer configuration
trainer:
  max_epochs: 70
  accelerator: auto
  devices: auto
  precision: '16-mixed' # Use mixed precision for speed
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  enable_checkpointing: true
  enable_progress_bar: false # Keep false for cleaner logs
  enable_model_summary: true
  
  callbacks:
    - class_path: src.nucdiff.trainer.lightning_callbacks.NuclearPhysicsDiagnostics
      init_args:
        print_frequency: 10
    - class_path: src.nucdiff.utils.callbacks.CustomProgressBar
    - class_path: pytorch_lightning.callbacks.ModelSummary
      init_args:
        max_depth: 2
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 40 # A bit more aggressive early stopping
        min_delta: 0.0001
        mode: min
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        save_top_k: 2
        mode: min
        filename: nucdiff-simple-{epoch:02d}-{val_loss:.4f}

# Seed for reproducibility
seed_everything: 412
