# pytorch_lightning==2.5.2
seed_everything: 412
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16-mixed
  logger: null
  callbacks:
  - class_path: src.nucdiff.trainer.lightning_callbacks.NuclearPhysicsDiagnostics
    init_args:
      print_frequency: 10
  - class_path: src.nucdiff.utils.callbacks.CustomProgressBar
  - class_path: pytorch_lightning.callbacks.ModelSummary
    init_args:
      max_depth: 2
  - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
      log_momentum: false
      log_weight_decay: false
  - class_path: pytorch_lightning.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      min_delta: 0.0001
      patience: 40
      verbose: false
      mode: min
      strict: true
      check_finite: true
      stopping_threshold: null
      divergence_threshold: null
      check_on_train_epoch_end: null
      log_rank_zero_only: false
  - class_path: pytorch_lightning.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: nucdiff-simple-{epoch:02d}-{val_loss:.4f}
      monitor: val/loss
      verbose: false
      save_last: null
      save_top_k: 2
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  fast_dev_run: false
  max_epochs: 70
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 20
  enable_checkpointing: true
  enable_progress_bar: false
  enable_model_summary: true
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  model_registry: null
model:
  d_model: 512
  n_heads: 8
  n_encoder_layers: 6
  n_decoder_layers: 6
  ff_dim: 2048
  dropout: 0.1
  label_smoothing: 0.0
  content_loss_weight: 1.0
  length_loss_weight: 0.002
  regr_loss_weight: 0.1
  use_dynamic_lambda: false
  lr_base: 0.0003
  lr_min: 1.0e-05
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 200
  use_separate_head_lr: true
  regr_lr_multiplier: 5.0
  delta_e_scaler: 100.0
  train_head: both
  vocab_size: null
  encoder_feature_dim: null
  pad_id: null
  class_weights: null
  eos_id: null
data:
  task: SEQ
  years_range: 2005-2010
  seed: 412
  train_frac: 0.8
  data_subset_ratio: 1.0
  batch_size: 64
  gradient_accumulation_steps: 2
  num_workers: 4
  force_rebuild_vocab: false
  overfit: false
  overfit_samples: 5
  epoch_resample: false
  k_year_augment: 2
optimizer: null
lr_scheduler: null
ckpt_path: null
