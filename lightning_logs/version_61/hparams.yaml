_instantiator: pytorch_lightning.cli.instantiate_module
content_loss_weight: 1.0
d_model: 512
delta_e_scaler: 100.0
dropout: 0.1
ff_dim: 2048
grad_clip_norm: 1.0
label_smoothing: 0.0
lr_base: 0.0003
lr_min: 1.0e-05
n_decoder_layers: 6
n_encoder_layers: 6
n_heads: 8
regr_loss_weight: 0.1
regr_lr_multiplier: 5.0
train_head: both
use_dynamic_lambda: false
use_separate_head_lr: true
warmup_steps: 200
weight_decay: 0.01
